name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

  oracle-plsql-hooks:
    name: Oracle PL/SQL hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORACLE_IMAGE: container-registry.oracle.com/database/free:latest-lite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build runnora
        run: go build -o runnora-ci .

      - name: Start Oracle and test API
        run: docker compose -f test/docker-compose.yaml up -d --build --wait --wait-timeout 900 testapi

      - name: Verify Oracle schema and API
        shell: bash
        run: |
          docker exec -i oracle-free sqlplus -s "/ as sysdba" <<'SQL'
          WHENEVER SQLERROR EXIT FAILURE
          ALTER SESSION SET CONTAINER = FREEPDB1;
          DECLARE
            v_count NUMBER;
          BEGIN
            SELECT COUNT(*) INTO v_count FROM testuser.users;
          END;
          /
          EXIT
          SQL
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "test API did not become ready" >&2
          exit 1

      - name: Verify before and after PL/SQL hooks
        working-directory: test
        shell: bash
        run: |
          ../runnora-ci run --config ./config.yaml \
            --before-sql ./sql/plsql/seed_with_cursor.sql \
            --after-sql ./sql/plsql/cleanup_with_exception.sql \
            ./runbooks/plsql_hook_verify.yaml

          docker exec -i oracle-free sqlplus -s "/ as sysdba" <<'SQL'
          WHENEVER SQLERROR EXIT FAILURE
          ALTER SESSION SET CONTAINER = FREEPDB1;
          DECLARE
            v_count NUMBER;
          BEGIN
            SELECT COUNT(*) INTO v_count FROM testuser.users;
            IF v_count <> 0 THEN
              RAISE_APPLICATION_ERROR(-20002, 'after hook left rows in testuser.users');
            END IF;
          END;
          /
          EXIT
          SQL

      - name: Verify after PL/SQL failure is reported
        working-directory: test
        shell: bash
        run: |
          set +e
          output=$(../runnora-ci run --config ./config.yaml \
            --after-sql ./sql/plsql/cleanup_with_exception.sql \
            ./runbooks/health_check.yaml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 4 ]; then
            echo "expected after-hook failure exit code 4, got $status" >&2
            exit 1
          fi
          if ! grep -q 'ORA-20001' <<<"$output"; then
            echo "expected the PL/SQL application error from the after hook" >&2
            exit 1
          fi

      - name: Oracle logs on failure
        if: failure()
        run: docker compose -f test/docker-compose.yaml logs --no-color oracle testapi

      - name: Stop test containers
        if: always()
        run: docker compose -f test/docker-compose.yaml down -v
