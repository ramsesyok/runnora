desc: "蔵書を検索する template"
labels:
  - generated
  - openapi
  - "books"
  - method:get
  - "operation:listBooks"
  - mode:template

runners:
  "req":
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    "req":
      "/books?genre={{ vars.case.queryParams.genre }}\u0026availableOnly={{ vars.case.queryParams.availableOnly }}":
        get:
          headers: "{{ vars.case.headers }}"

  dump_response:
    dump:
      expr: steps.call_api.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/get_listBooks-{{ vars.case.name }}.json'
  check_response:
    test: steps.call_api.res.status == vars.case.expect.status
