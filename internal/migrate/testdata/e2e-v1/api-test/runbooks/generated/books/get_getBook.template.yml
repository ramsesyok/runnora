desc: "蔵書を 1 件取得する template"
labels:
  - generated
  - openapi
  - "books"
  - method:get
  - "operation:getBook"
  - mode:template

runners:
  "req":
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    "req":
      "/books/{{ vars.case.pathParams.bookId }}":
        get:
          headers: "{{ vars.case.headers }}"

  dump_response:
    dump:
      expr: steps.call_api.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/get_getBook-{{ vars.case.name }}.json'
  check_response:
    test: steps.call_api.res.status == vars.case.expect.status
