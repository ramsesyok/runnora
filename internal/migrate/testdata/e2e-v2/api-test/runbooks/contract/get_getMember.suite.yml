desc: 契約 getMember 会員と貸出状況を取得する（モック・実APIの両方で実行する）
runnora:
  id: CONTRACT-getMember
labels:
  - contract
  - members
  - operation:getMember

# ケースごとに include ステップを 1 つずつ並べる。
#   runn の loop (until なし) は最後の回の失敗しか報告しないため、loop + include でケースを回すと
#   途中のケースの失敗を見逃す。明示的なステップなら各ケースの失敗がそのまま報告される。
# case     : 入力と期待ステータス (cases/contract/)
# expected : 期待する応答本文。oapi2wire がモックの戻り値として返すファイルと同一 (fixtures/responses/)

steps:
  M0001:
    desc: 貸出のない会員 M0001
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_getMember.template.yml
      vars:
        case: json://../../cases/contract/members/get_getMember/01_M0001.json
        expected: json://../../fixtures/responses/getMember/getMember_M0001.json
  M0003_suspended:
    desc: 利用停止中の会員 M0003
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_getMember.template.yml
      vars:
        case: json://../../cases/contract/members/get_getMember/02_M0003_suspended.json
        expected: json://../../fixtures/responses/getMember/getMember_M0003_suspended.json
  not_found:
    desc: 存在しない会員は 404
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_getMember.template.yml
      vars:
        case: json://../../cases/contract/members/get_getMember/03_not_found.json
        expected: json://../../fixtures/responses/getMember/getMember_not_found.json
