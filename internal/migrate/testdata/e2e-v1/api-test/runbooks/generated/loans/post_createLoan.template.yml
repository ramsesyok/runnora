desc: "本を貸し出す template"
labels:
  - generated
  - openapi
  - "loans"
  - method:post
  - "operation:createLoan"
  - mode:template

runners:
  "req":
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    "req":
      "/loans":
        post:
          headers: "{{ vars.case.headers }}"
          body:
            application/json: "{{ vars.case.requestBody }}"

  dump_response:
    dump:
      expr: steps.call_api.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/post_createLoan-{{ vars.case.name }}.json'
  check_response:
    test: steps.call_api.res.status == vars.case.expect.status
