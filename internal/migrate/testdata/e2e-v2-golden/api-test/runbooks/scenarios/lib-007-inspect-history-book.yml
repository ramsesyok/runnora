desc: LIB-007 履歴の蔵書を照会する
runners:
  req:
    endpoint: ${API_URL}
    openapi3: ../../openapi/library-api.yaml
    skipValidateRequest: true
vars:
  index: 0
  book_id: ''
steps:
  fetch:
    req:
      /books/{{ vars.book_id }}:
        get:
          headers:
            X-Test-Scenario: LIB-007
          body: null
  check_response:
    test: steps.fetch.res.status == 200 && steps.fetch.res.body.bookId == vars.book_id
