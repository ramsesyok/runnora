name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Check Go vulnerabilities
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          (cd test/testapi && "$(go env GOPATH)/bin/govulncheck" ./...)
          (cd test/testgrpc && "$(go env GOPATH)/bin/govulncheck" ./...)

  multipart-spring:
    name: Multipart Spring Boot E2E
    # Keep the workflow and fixtures on the same immutable E2E commit.
    uses: ramsesyok/runnora-e2e/.github/workflows/multipart-reusable.yml@421a92319c23aa28a0d7de9251ea7982a606f415
    with:
      e2e-ref: 421a92319c23aa28a0d7de9251ea7982a606f415
      runnora-repository: ${{ github.repository }}
      runnora-ref: ${{ github.sha }}

  oracle-plsql-hooks:
    name: Oracle PL/SQL hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORACLE_IMAGE: container-registry.oracle.com/database/free:latest-lite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build runnora
        run: go build -o runnora-ci .

      - name: Start Oracle and test API
        run: docker compose -f test/docker-compose.yaml up -d --build --wait --wait-timeout 900 testapi

      - name: Wait for Oracle schema
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker exec -i oracle-free sqlplus -s "/ as sysdba" <<'SQL' | grep -q 'SCHEMA_READY'
          ALTER SESSION SET CONTAINER = FREEPDB1;
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0
          SELECT 'SCHEMA_READY' FROM dba_tables WHERE owner = 'TESTUSER' AND table_name = 'USERS';
          EXIT
          SQL
            then
              exit 0
            fi
            sleep 5
          done
          echo "Oracle schema did not become ready" >&2
          docker compose -f test/docker-compose.yaml logs --no-color oracle >&2
          exit 1

      - name: Verify Oracle schema and API
        shell: bash
        run: |
          docker exec -i oracle-free sqlplus -s "/ as sysdba" <<'SQL'
          WHENEVER SQLERROR EXIT FAILURE
          ALTER SESSION SET CONTAINER = FREEPDB1;
          DECLARE
            v_count NUMBER;
          BEGIN
            SELECT COUNT(*) INTO v_count FROM testuser.users;
          END;
          /
          EXIT
          SQL
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/health | grep -q '"db":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "test API did not become ready" >&2
          exit 1

      - name: Validate test project
        working-directory: test
        run: ../runnora-ci validate

      - name: Verify before and after PL/SQL hooks
        working-directory: test
        shell: bash
        run: |
          # plsql スイート (runnora.yaml) を実行する。
          #   PLSQL-AFTER-HOOK-FAILURE: 0 件の状態で事後処理の PL/SQL 例外が起きることを期待する (expect: hookFail)
          #   PLSQL-HOOK-VERIFY:        事前処理で 3 件投入し、事後処理で削除する
          ../runnora-ci run --suite plsql --report-format json --report-out plsql-report.json
          cat plsql-report.json

          jq -e '.failed == 0 and .passed == 2' plsql-report.json
          jq -e '.results[] | select(.id == "PLSQL-AFTER-HOOK-FAILURE")
                 | .expect == "hookFail" and .actual == "hookFail" and (.error | contains("ORA-20001"))' plsql-report.json
          jq -e '.results[] | select(.id == "PLSQL-HOOK-VERIFY") | .actual == "pass"' plsql-report.json

          # 実行ごとのフォルダ (reports/<日時>-plsql/) に report.json と証跡が保存されていること
          run_dir=$(ls -d reports/*-plsql | tail -n 1)
          ls -R "$run_dir"
          jq -e '.suite == "plsql" and .evidenceDir == "evidence"' "$run_dir/report.json"
          ev="$run_dir/evidence/PLSQL-HOOK-VERIFY"
          jq -e '.runner == "db" and .response.results[0].rows[0].CNT == "3"' "$ev/01-check_seeded_count.json"
          jq -e '.runner == "http" and .response.status == 200 and (.response.body | length) == 3' "$ev/02-list_seeded_users.json"

          # ステップ単位の結果と前後処理の記録
          jq -e '.schemaVersion == 2 and .elapsedMs >= 0' "$run_dir/report.json"
          jq -e '.results[] | select(.id == "PLSQL-HOOK-VERIFY")
                 | (.steps[0] | .key == "check_seeded_count" and .result == "success" and .evidence == ["PLSQL-HOOK-VERIFY/01-check_seeded_count.json"])
                   and all(.hooks[]; .ok)' "$run_dir/report.json"
          jq -e '.results[] | select(.id == "PLSQL-AFTER-HOOK-FAILURE")
                 | .hooks | map(select(.ok == false)) | length == 1 and (.[0].phase == "after") and (.[0].error | contains("ORA-20001"))' "$run_dir/report.json"

          # サマリー HTML: シナリオと、証跡への相対リンクが載っていること
          grep -q 'PLSQL-HOOK-VERIFY' "$run_dir/summary.html"
          grep -q 'href="evidence/PLSQL-HOOK-VERIFY/01-check_seeded_count.json"' "$run_dir/summary.html"

          docker exec -i oracle-free sqlplus -s "/ as sysdba" <<'SQL'
          WHENEVER SQLERROR EXIT FAILURE
          ALTER SESSION SET CONTAINER = FREEPDB1;
          DECLARE
            v_count NUMBER;
          BEGIN
            SELECT COUNT(*) INTO v_count FROM testuser.users;
            IF v_count <> 0 THEN
              RAISE_APPLICATION_ERROR(-20002, 'after hook left rows in testuser.users');
            END IF;
          END;
          /
          EXIT
          SQL

      - name: Oracle logs on failure
        if: failure()
        run: docker compose -f test/docker-compose.yaml logs --no-color oracle testapi

      - name: Stop test containers
        if: always()
        run: docker compose -f test/docker-compose.yaml down -v
