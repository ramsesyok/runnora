desc: 契約 listMemberLoans 会員の貸出履歴を取得する（モック・実APIの両方で実行する）
runnora:
  id: CONTRACT-listMemberLoans
labels:
  - contract
  - members
  - operation:listMemberLoans

# ケースごとに include ステップを 1 つずつ並べる。
#   runn の loop (until なし) は最後の回の失敗しか報告しないため、loop + include でケースを回すと
#   途中のケースの失敗を見逃す。明示的なステップなら各ケースの失敗がそのまま報告される。
# case     : 入力と期待ステータス (cases/contract/)
# expected : 期待する応答本文。oapi2wire がモックの戻り値として返すファイルと同一 (fixtures/responses/)

steps:
  M0002:
    desc: M0002 は貸出中 1 件・返却済 1 件 (contract_setup.sql)
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_listMemberLoans.template.yml
      vars:
        case: json://../../cases/contract/members/get_listMemberLoans/01_M0002.json
        expected: json://../../fixtures/responses/listMemberLoans/listMemberLoans_M0002.json
  not_found:
    desc: 存在しない会員は 404
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_listMemberLoans.template.yml
      vars:
        case: json://../../cases/contract/members/get_listMemberLoans/02_not_found.json
        expected: json://../../fixtures/responses/listMemberLoans/listMemberLoans_not_found.json
