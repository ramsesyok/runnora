desc: 契約 getBook 蔵書を 1 件取得する（モック・実APIの両方で実行する）
runnora:
  id: CONTRACT-getBook
labels:
  - contract
  - books
  - operation:getBook

# ケースごとに include ステップを 1 つずつ並べる。
#   runn の loop (until なし) は最後の回の失敗しか報告しないため、loop + include でケースを回すと
#   途中のケースの失敗を見逃す。明示的なステップなら各ケースの失敗がそのまま報告される。
# case     : 入力と期待ステータス (cases/contract/)
# expected : 期待する応答本文。oapi2wire がモックの戻り値として返すファイルと同一 (fixtures/responses/)

steps:
  B0001:
    desc: 登録済みの蔵書 B0001
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_getBook.template.yml
      vars:
        case: json://../../cases/contract/books/get_getBook/01_B0001.json
        expected: json://../../fixtures/responses/getBook/getBook_B0001.json
  not_found:
    desc: 存在しない蔵書は 404
    include:
      # json:// の相対パスは include 先 template の位置で解決されるため、template は suite と同じ場所に置く
      path: ./get_getBook.template.yml
      vars:
        case: json://../../cases/contract/books/get_getBook/02_not_found.json
        expected: json://../../fixtures/responses/getBook/getBook_not_found.json
