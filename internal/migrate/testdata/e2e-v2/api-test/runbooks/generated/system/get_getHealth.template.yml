desc: "稼働状態を確認する template"
labels:
  - generated
  - openapi
  - "system"
  - method:get
  - "operation:getHealth"
  - mode:template

runners:
  "req":
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    "req":
      "/health":
        get:
          headers: "{{ vars.case.headers }}"

  dump_response:
    dump:
      expr: steps.call_api.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/get_getHealth-{{ vars.case.name }}.json'
  check_response:
    test: steps.call_api.res.status == vars.case.expect.status
