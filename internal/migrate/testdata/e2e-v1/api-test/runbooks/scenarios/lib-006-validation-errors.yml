desc: LIB-006 異常系（入力不正400・存在しない404・利用停止409）でDBが変わらない
# 実行: runnora run --config config.yaml --after-sql sql/cases/lib006_assert_no_loans_after.sql <this>
labels:
  - scenario
  - negative
runners:
  req:
    endpoint: http://127.0.0.1:18081
    # 応答を OpenAPI 定義で自動検証する。異常系の入力を送るためリクエスト側の検証は行わない
    openapi3: ../../openapi/library-api.yaml
    skipValidateRequest: true
steps:
  suspended_member:
    desc: 利用停止中の会員M0003は借りられない
    req:
      /loans:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              memberId: M0003
              bookId: B0001
  dump_suspended_member:
    dump:
      expr: steps.suspended_member.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/suspended_member.json'
  check_suspended_member:
    test: |
      steps.suspended_member.res.status == 409 &&
      steps.suspended_member.res.body.code == "MEMBER_SUSPENDED"

  unknown_member:
    desc: 存在しない会員M9999は404
    req:
      /loans:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              memberId: M9999
              bookId: B0001
  dump_unknown_member:
    dump:
      expr: steps.unknown_member.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/unknown_member.json'
  check_unknown_member:
    test: |
      steps.unknown_member.res.status == 404 &&
      steps.unknown_member.res.body.code == "NOT_FOUND"

  unknown_book:
    desc: 存在しない蔵書B9999は404
    req:
      /loans:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              memberId: M0001
              bookId: B9999
  dump_unknown_book:
    dump:
      expr: steps.unknown_book.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/unknown_book.json'
  check_unknown_book:
    test: |
      steps.unknown_book.res.status == 404 &&
      steps.unknown_book.res.body.code == "NOT_FOUND"

  missing_book_id:
    desc: bookIdが無いリクエストは400
    req:
      /loans:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              memberId: M0001
  dump_missing_book_id:
    dump:
      expr: steps.missing_book_id.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/missing_book_id.json'
  check_missing_book_id:
    test: |
      steps.missing_book_id.res.status == 400 &&
      steps.missing_book_id.res.body.code == "VALIDATION_ERROR" &&
      steps.missing_book_id.res.body.message == "bookId is required"

  unknown_field:
    desc: 定義に無い項目を含むリクエストは400
    req:
      /loans:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              memberId: M0001
              bookId: B0001
              days: 30
  dump_unknown_field:
    dump:
      expr: steps.unknown_field.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/unknown_field.json'
  check_unknown_field:
    test: |
      steps.unknown_field.res.status == 400 &&
      steps.unknown_field.res.body.code == "VALIDATION_ERROR"

  invalid_isbn:
    desc: 13桁でないISBNでは蔵書を登録できない
    req:
      /books:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              bookId: B0901
              isbn: "978400"
              title: 不正ISBN
              author: 試験 花子
              genre: TECH
              totalCopies: 1
  dump_invalid_isbn:
    dump:
      expr: steps.invalid_isbn.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/invalid_isbn.json'
  check_invalid_isbn:
    test: |
      steps.invalid_isbn.res.status == 400 &&
      steps.invalid_isbn.res.body.message == "isbn must be 13 digits"

  invalid_copies:
    desc: 所蔵冊数0では蔵書を登録できない
    req:
      /books:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json:
              bookId: B0902
              isbn: "9784000000902"
              title: 冊数不正
              author: 試験 花子
              genre: TECH
              totalCopies: 0
  dump_invalid_copies:
    dump:
      expr: steps.invalid_copies.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/invalid_copies.json'
  check_invalid_copies:
    test: |
      steps.invalid_copies.res.status == 400 &&
      steps.invalid_copies.res.body.message == "totalCopies must be between 1 and 99"

  invalid_genre:
    desc: 定義外のジャンルでの検索は400
    req:
      /books?genre=COMIC:
        get:
          headers:
            X-Test-Scenario: LIB-006
          body: null
  dump_invalid_genre:
    dump:
      expr: steps.invalid_genre.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/invalid_genre.json'
  check_invalid_genre:
    test: |
      steps.invalid_genre.res.status == 400 &&
      steps.invalid_genre.res.body.code == "VALIDATION_ERROR"

  invalid_status_filter:
    desc: 定義外の貸出状態での絞り込みは400
    req:
      /members/M0001/loans?status=LOST:
        get:
          headers:
            X-Test-Scenario: LIB-006
          body: null
  dump_invalid_status_filter:
    dump:
      expr: steps.invalid_status_filter.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/invalid_status_filter.json'
  check_invalid_status_filter:
    test: steps.invalid_status_filter.res.status == 400

  unknown_loan:
    desc: 存在しない貸出の返却は404
    req:
      /loans/9999/return:
        post:
          headers:
            X-Test-Scenario: LIB-006
          body:
            application/json: {}
  dump_unknown_loan:
    dump:
      expr: steps.unknown_loan.res
      out: '{{ env.RUNNORA_EVIDENCE_DIR }}/unknown_loan.json'
  check_unknown_loan:
    test: |
      steps.unknown_loan.res.status == 404 &&
      steps.unknown_loan.res.body.code == "NOT_FOUND"
